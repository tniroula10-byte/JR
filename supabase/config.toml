project_id = "john-rambo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/callback"]
enable_signup = false

[auth.email]
# Email/password login stays on; public sign-up is off via [auth] enable_signup above
double_confirm_changes = true
enable_confirmations = true

# Invites send a 6-digit code (not a link) that customers enter on /login.
# Hosted projects need the same template under Authentication > Email Templates > Magic Link.
[auth.email.template.magic_link]
subject = "Your John Rambo verification code"
content_path = "./supabase/templates/otp-code.html"

[auth.rate_limit]
email_sent = 60
